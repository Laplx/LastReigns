<!doctype html><meta charset=utf8>
<title>iter preview</title>
<link rel="stylesheet" href="styles.css">
<body class="playing" style="padding:20px">
<div id="app" style="max-width:780px">
  <h3 style="font-family:var(--serif);color:var(--gold)">状态栏人物（职业 icon，无深圈，略小）</h3>
  <div id="people-tabs" class="people-tabs panel"></div>
  <h3 style="font-family:var(--serif);color:var(--gold);margin-top:22px">事件卡（画像+下方职务/名字/icon，下缘柔化）</h3>
  <div id="slotA"></div>
  <h3 style="font-family:var(--serif);color:var(--gold);margin-top:22px">年终召见（左列选人 / 右侧详情）</h3>
  <div id="slotB"></div>
  <h3 style="font-family:var(--serif);color:var(--gold);margin-top:22px">私下接触（右侧画像+icon）</h3>
  <div id="slotC"></div>
  <div id="stage-content"></div>
  <div id="overlay" class="hidden"><div id="overlay-body"></div></div>
</div>
<script type="module">
import { portraitForPerson } from './src/portraits.js';
import { renderCard, renderPeople, renderAdvisorSummonCard, renderAdvisorActionCard, setPortraitContent } from './src/ui.js';
const portraits=await fetch('./data/portraits.json').then(r=>r.json());
const portraitArt=await fetch('./data/portraits-art.json').then(r=>r.json());
const content={portraits,portraitArt}; setPortraitContent(content);
const people=[
  {id:'general',name:'卡苏拉将军',title:'武装力量总司令',portraitId:'general',traits:['务实','好大喜功'],blurb:'枪杆子的主人。他的忠诚是租来的。',loyalty:62,competence:70,alive:true,memory:[]},
  {id:'finance',name:'恩戈齐博士',title:'财政部长',portraitId:'finance',traits:['贪婪','谨慎'],blurb:'管钱的人。',loyalty:55,competence:75,alive:true,memory:[]},
  {id:'firstlady',name:'伊莎贝尔夫人',title:'第一夫人 / 家族代表',portraitId:'firstlady',traits:['野心'],blurb:'枕边的政治家。',loyalty:60,competence:60,alive:true,memory:[]},
  {id:'spy',name:'安巴妮上校',title:'国家安全局局长',portraitId:'spy',traits:['多疑','缜密'],blurb:'知道所有人秘密的人。',loyalty:58,competence:78,alive:true,memory:[]},
];
const state={people};
const move=(id)=>{const sc=document.getElementById('stage-content');const n=sc.firstElementChild;document.getElementById(id).appendChild(n);};
renderPeople(state,{selectedId:'general',onSelect:()=>{}});
renderCard({kicker:'警讯',title:'军营里的低语',speaker:'卡苏拉将军',narrative:'参谋们在沙盘前争执不下。将军把军帽摘下放在桌上，语气平静得反常：欠饷的事，士兵们已经知道了。再拖下去，没人敢保证夜里的城防。',options:[{text:'立刻补发军饷'},{text:'承诺三个月后兑现'},{text:'撤换带头闹事的军官'}],portrait:portraitForPerson(content,people[0])},{onChoose:()=>{}});
move('slotA');
renderAdvisorSummonCard(state,{selectedId:'spy',statusFor:()=>['近来推诿渐多，有几次会议称病未到。','手腕老练，交办之事总能办成。'],onSelect:()=>{},onEngage:()=>{}});
move('slotB');
renderAdvisorActionCard(people[1],{intro:'博士推了推眼镜，等您先开口。',options:[{kind:'施压',label:'查他经手的进口配额账目'},{kind:'拉拢',label:'许他一个海外考察名额'},{kind:'试探',label:'随口问问最近的汇率风声'}]},{canReshuffle:true,onReshuffle:()=>{},onChoose:()=>{}});
move('slotC');
</script>
</body>
